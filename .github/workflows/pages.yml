name: Build and deploy site

# Rebuilds the site, including one real page per approved teacher and class.
# Runs on every push, every hour (to pick up newly approved teachers and new classes), and on demand.
#
# Two destinations while the site moves host:
#   - GitHub Pages: the first address. To be switched off once Cloudflare is confirmed.
#   - Cloudflare:   runs only when the CLOUDFLARE_API_TOKEN secret exists. Needs the repository
#                   variables CLOUDFLARE_ACCOUNT_ID and CF_SITE_URL (the public address on Cloudflare).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # Emails the admin when something new is waiting for them. The key below is the site's public key.
      - name: Admin digest
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          curl -s -m 30 -X POST "https://xzmamfglxmjjxjsetuaa.supabase.co/functions/v1/admin-digest" \
            -H "apikey: sb_publishable_J6pwCLXOBOp2hXlI183_dw_m06F6Jhh" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6bWFtZmdseG1qanhqc2V0dWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzM1MzcsImV4cCI6MjEwNjU0OTUzN30.LxHCsaYYS5SV4KV_vzaNtvVAfwyMQaONj8QkzDkJcb0" \
            -H "Content-Type: application/json" -d '{}'

      - name: Build for Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          SITE_URL: ${{ vars.CF_SITE_URL || 'https://seastackschool.workers.dev/' }}
          OUT_DIR: _site_cf
        run: node scripts/build-pages.mjs
      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
