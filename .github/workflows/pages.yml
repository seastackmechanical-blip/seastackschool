name: Build and deploy site

# Rebuilds the site, including one real page per approved teacher and class.
# Runs on every push, every hour (to pick up newly approved teachers and new classes), and on demand.
#
# The site is served by Cloudflare at https://seastackschool.com/ (Worker "seastackschool", static files).
# Needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # A new Android APK was committed by its own workflow: publish the site so the download is live.
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Emails the admin when something new is waiting for them. The key below is the site's public key.
      - name: Admin digest
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          curl -s -m 30 -X POST "https://xzmamfglxmjjxjsetuaa.supabase.co/functions/v1/admin-digest" \
            -H "apikey: sb_publishable_J6pwCLXOBOp2hXlI183_dw_m06F6Jhh" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6bWFtZmdseG1qanhqc2V0dWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzM1MzcsImV4cCI6MjEwNjU0OTUzN30.LxHCsaYYS5SV4KV_vzaNtvVAfwyMQaONj8QkzDkJcb0" \
            -H "Content-Type: application/json" -d '{}'

      # Sends any refund the database has marked as due and that was not sent at the moment of cancelling.
      - name: Send due refunds
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          curl -s -m 60 -X POST "https://xzmamfglxmjjxjsetuaa.supabase.co/functions/v1/stripe-refunds" \
            -H "apikey: sb_publishable_J6pwCLXOBOp2hXlI183_dw_m06F6Jhh" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6bWFtZmdseG1qanhqc2V0dWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzM1MzcsImV4cCI6MjEwNjU0OTUzN30.LxHCsaYYS5SV4KV_vzaNtvVAfwyMQaONj8QkzDkJcb0" \
            -H "Content-Type: application/json" -d '{}'

      - name: Build for Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          SITE_URL: ${{ vars.CF_SITE_URL || 'https://seastackschool.com/' }}
          OUT_DIR: _site_cf
        run: node scripts/build-pages.mjs
      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
