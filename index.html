<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeastackSchool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#1B2440; --muted:#5A6482; --line:#DCE1EC;
  --pen:#2F5BEA; --pen-soft:#E3EAFD; --pencil:#F2B531; --pencil-soft:#FDF1D3;
  --leaf:#2E8B6A; --leaf-soft:#DDF1E8; --rose:#C9445C; --rose-soft:#F9E0E5;
  --shadow:0 1px 0 var(--line);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121726; --surface:#1A2135; --ink:#EDF0F8; --muted:#A3ACC6; --line:#2C3550;
    --pen:#7D9BFF; --pen-soft:#24305A; --pencil:#F5C24F; --pencil-soft:#3A3220;
    --leaf:#5CC79F; --leaf-soft:#1D3A30; --rose:#F07A90; --rose-soft:#3D2028;
  }
}
:root[data-theme="dark"]{
  --bg:#121726; --surface:#1A2135; --ink:#EDF0F8; --muted:#A3ACC6; --line:#2C3550;
  --pen:#7D9BFF; --pen-soft:#24305A; --pencil:#F5C24F; --pencil-soft:#3A3220;
  --leaf:#5CC79F; --leaf-soft:#1D3A30; --rose:#F07A90; --rose-soft:#3D2028;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0 0 .4em;letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,3vw,2.2rem)} h3{font-size:1.25rem}
p{margin:0 0 1em} a{color:var(--pen)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--pen-soft);color:var(--ink);border-color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.field input,.field select,.field textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pen);outline:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.logo{font-family:var(--display);font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.logo .dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--pen) 0 25%,var(--pencil) 0 50%,var(--leaf) 0 75%,var(--rose) 0)}
nav.main{display:flex;gap:4px;flex:1;overflow-x:auto}
nav.main a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);white-space:nowrap;font-weight:700;font-size:.95rem}
nav.main a.on{background:var(--ink);color:var(--bg)}
.role select{border:1.5px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--surface);font-size:.9rem}
@media (max-width:760px){.top .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px}nav.main{order:3;flex-basis:100%}}

/* hero */
.hero{padding-block:56px 28px}
.hero h1{font-size:clamp(2.6rem,7.5vw,5.6rem);font-weight:800;line-height:.95;letter-spacing:-.035em;max-width:13ch}
.hero h1 span{display:block;color:var(--muted);font-weight:500}
.hero .lead{font-size:1.2rem;max-width:52ch;color:var(--muted);margin:18px 0 26px}
.hero .search{display:flex;gap:8px;flex-wrap:wrap;max-width:640px}
.hero .search input{flex:1;min-width:200px;padding:14px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);font-size:1.05rem}
.clocks{margin-top:40px;border-top:2px solid var(--ink);padding-top:16px}
.clocks h3{font-size:1rem;font-family:var(--body);font-weight:700;margin-bottom:12px}
.clockrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.clock{flex:0 0 250px;scroll-snap-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left}
.clock:hover{border-color:var(--pen)}
.clock .t{font-family:var(--display);font-size:1.7rem;font-weight:700}
.clock .city{font-size:.85rem;color:var(--muted)}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px;padding:48px 0;counter-reset:s}
.steps div{border-left:3px solid var(--pencil);padding-left:16px}
.steps div h3::before{counter-increment:s;content:counter(s) ". ";color:var(--pen)}
.teachband{background:var(--ink);color:var(--bg);border-radius:24px;padding:40px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;margin:20px 0 56px}
.teachband .btn{background:var(--pencil);border-color:var(--pencil);color:#1B2440}
.teachband ul{margin:0;padding-left:20px}
@media (max-width:760px){.teachband{grid-template-columns:1fr;padding:26px}}

/* browse */
.browse{display:grid;grid-template-columns:260px 1fr;gap:28px;padding-block:30px 60px}
.filters{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:14px}
.filters h3{margin-bottom:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:860px){.browse{grid-template-columns:1fr}.filters{position:static}}
.results-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:12px}
.listing{display:grid;grid-template-columns:64px 1fr auto;gap:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;align-items:start}
.listing:hover{border-color:var(--ink)}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;color:#1B2440}
.avatar.lg{width:110px;height:110px;font-size:2.3rem}
.listing h3{margin:0 0 2px;font-size:1.15rem}
.listing h3 button{all:unset;cursor:pointer}
.listing h3 button:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted);margin:6px 0}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:6px}
.tag.private{background:var(--pen-soft);color:var(--pen)}
.tag.group{background:var(--pencil-soft);color:#8A5F00}
:root[data-theme="dark"] .tag.group{color:var(--pencil)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.group{color:var(--pencil)}}
.price{text-align:right}
.price b{font-family:var(--display);font-size:1.4rem;display:block}
.next{font-size:.9rem;margin-top:4px}
.places{font-size:.85rem;font-weight:700}
.places.low{color:var(--rose)}
@media (max-width:600px){.listing{grid-template-columns:48px 1fr}.listing .avatar{width:48px;height:48px;font-size:1rem}.price{grid-column:1/-1;text-align:left;display:flex;gap:12px;align-items:center;flex-wrap:wrap}}
.empty{border:2px dashed var(--line);border-radius:16px;padding:30px;text-align:center}

/* teacher profile */
.profile{padding-block:36px 60px}
.profile-head{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:32px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.stars{color:var(--pencil);letter-spacing:2px}
.review{border-top:1px solid var(--line);padding:12px 0}
.review:first-of-type{border-top:0}

/* modal */
dialog{border:0;border-radius:20px;padding:0;max-width:min(620px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,15,40,.35)}
dialog::backdrop{background:rgba(15,20,40,.5)}
.dlg{padding:24px;max-height:86vh;overflow:auto}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.x{background:none;border:0;font-size:1.6rem;cursor:pointer;line-height:1;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.slot{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);cursor:pointer;text-align:left}
.slot[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.slot[disabled]{opacity:.4;cursor:not-allowed}
.slot b{display:block}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.notice{background:var(--pencil-soft);border-radius:12px;padding:12px 14px;font-size:.92rem;margin:12px 0}
.ok{background:var(--leaf-soft);border-radius:12px;padding:14px}
.err{color:var(--rose);font-size:.9rem;min-height:1.2em}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:.9rem;overflow-x:auto;white-space:nowrap}

/* tables / dashboard */
.page{padding-block:32px 60px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 20px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--pen)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;background:var(--surface);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:.94rem}
th{font-family:var(--display);font-weight:700}
td input{width:64px;padding:5px 7px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.week{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto}
.day{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:220px;display:flex;flex-direction:column;gap:8px}
.day h4{font-size:1rem;margin:0}
.plan{background:var(--bg);border-left:4px solid var(--pen);border-radius:8px;padding:8px 10px;font-size:.88rem}
.plan b{display:block}
.plan button{all:unset;cursor:pointer;color:var(--muted);font-size:.8rem;float:right}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.res{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
details{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
summary{font-weight:700;cursor:pointer}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:50;font-weight:700}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
.tag.demo{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-family:var(--body);letter-spacing:.02em}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.btn.lg{padding:14px 26px;font-size:1.1rem}
.aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding-top:40px}
.aud .box{margin:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.aud ul{margin:0;padding-left:20px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:4px}
.choice{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:var(--bg)}
.choice:has(input:checked){border-color:var(--pen);background:var(--pen-soft)}
.choice b{display:block;font-family:var(--display);font-size:1.05rem}
.choice input{margin-top:5px}
.tag.ok{background:var(--leaf-soft);color:var(--leaf)}
.tag.bad{background:var(--rose-soft);color:var(--rose)}
.notice.bad{background:var(--rose-soft)}
.admin td{vertical-align:top}
.admin td input{width:100%;min-width:150px}
.admin .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/"><span class="dot" aria-hidden="true"></span>SeastackSchool</a>
    <nav class="main" aria-label="Main">
      <a href="#/classes" data-r="classes">Find classes</a>
      <a href="#/learning" data-r="learning">My lessons</a>
      <a href="#/studio" data-r="studio">Teacher studio</a>
      <a href="#/help" data-r="help">Help</a>
    </nav>
    <label class="role small">
      <span class="sr">Viewing as</span>
      <select id="role" aria-label="Viewing as">
        <option value="learner">Learner</option>
        <option value="parent">Parent</option>
      </select>
    </label>
  </div>
</header>
<main id="app"></main>
<footer><div class="wrap">Teachers, classes and reviews marked Demo are samples, not real people. Booking and payment are not open yet; nothing is charged. Times show in your time zone: <b id="tzname"></b>.</div></footer>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fmtDay = d => d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});

const money = n => "$" + n.toFixed(0);
function store(k, v){ try{ if(v===undefined){ const r=localStorage.getItem("ec:"+k); return r?JSON.parse(r):null } localStorage.setItem("ec:"+k, JSON.stringify(v)) }catch(e){ return null } }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600) }
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------- seed data ---------- */

   intro:"Drawing and painting for kids and adults, plus Brazilian Portuguese.", exp:"10 years; illustrator; art-school teacher."}
];
const CLASSES = [

  {id:"c2",t:"t1",title:"1:1 exam preparation (IGCSE / A-level)",subject:"Maths",lang:"English",type:"private",price:40,cap:1,ages:[14,19],level:"Advanced",days:[2,4,6],hour:15,mins:60},

/* sessions for next 14 days, computed from the teacher's local hour → UTC → viewer local */
function sessions(c){
  const t = teacher(c.t), out=[], now=Date.now();
  const base = new Date(); base.setUTCHours(0,0,0,0);
  for(let i=0;i<14;i++){
    const d = new Date(base.getTime()+i*864e5);
    const teacherLocal = new Date(d.getTime()+ (t.offset)*36e5);
    if(!c.days.includes(teacherLocal.getUTCDay())) continue;
    const startUTC = Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()) + (c.hour - t.offset)*36e5;
    if(startUTC < now + 30*6e4) continue;
    const key = c.id+"@"+startUTC;
    const seeded = c.real ? 0 : c.type==="group" ? (hash(key)%(c.cap)) : (hash(key)%4===0?1:0);
    const mine = S.bookings.filter(b=>b.key===key).length;
    out.push({key,start:new Date(startUTC),left:Math.max(0,c.cap-seeded-mine)});
  }
  return out;
}
function hash(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)}
function reviewsFor(tid){ return SEED_REVIEWS.filter(r=>r.t===tid).map(r=>({...r,demo:true})).concat(S.reviews.filter(r=>r.t===tid)) }
function rating(tid){ const r=reviewsFor(tid); return r.length? (r.reduce((a,b)=>a+b.stars,0)/r.length) : teacher(tid).rating }
const starStr = n => "★".repeat(Math.round(n)) + "☆".repeat(5-Math.round(n));
const initials = n => n.split(" ").map(w=>w[0]).join("").slice(0,2);
const ageLabel = a => a[1]>=99 ? `Ages ${a[0]}+` : `Ages ${a[0]}–${a[1]}`;

function matches(c){
  const F=S.filters, t=teacher(c.t), q=F.q.trim().toLowerCase();
  if(q && !(c.title+" "+c.subject+" "+t.name+" "+c.lang).toLowerCase().includes(q)) return false;
  if(F.subject && c.subject!==F.subject) return false;
  if(F.lang && c.lang!==F.lang) return false;
  if(F.level && c.level!==F.level) return false;
  if(F.type && c.type!==F.type) return false;
  if(F.age){ const a=+F.age; if(a<c.ages[0]||a>c.ages[1]) return false }
  if(F.price && c.price>+F.price) return false;
  if(F.when){
    const ss=sessions(c).filter(s=>{const h=s.start.getHours(),d=s.start.getDay();
      return F.when==="morning"?h>=5&&h<12:F.when==="afternoon"?h>=12&&h<17:F.when==="evening"?h>=17&&h<23:(d===0||d===6)});
    if(!ss.length) return false;
  }
  return true;
}

      <div class="linkbox"><span>${esc(b.link)}</span></div>
      <p class="small muted">It's also saved in My lessons. The Join button opens 10 minutes before the start.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="navigator.clipboard?.writeText('${b.link}').then(()=>toast('Link copied'),()=>toast('Copy the link from the box'))">Copy link</button><a class="btn" href="#/learning" onclick="$('#dlg').close()">Go to My lessons</a></div>`;
  }
}
function pay(f){
  const card=f.card.value.replace(/\s/g,""), exp=f.exp.value.trim(), cvc=f.cvc.value.trim(), err=$("#perr");
  if(!/^\d{16}$/.test(card)) return err.textContent="Card number needs 16 digits.";
  if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(exp)) return err.textContent="Expiry should look like 08/28.";
  if(!/^\d{3,4}$/.test(cvc)) return err.textContent="CVC is the 3 or 4 digits on the back of the card.";
  const c=cls(BK.cid), start=+BK.key.split("@")[1];
  if(!sessions(c).find(s=>s.key===BK.key)?.left) return err.textContent="That time just filled up. Go back and choose another.";
  let who;
  if(S.role==="parent"){
    if(f.learner) who = S.children.find(k=>k.id===f.learner.value)?.name || "Child";
    else { const k={id:uid(),name:f.cname.value.trim(),age:+f.cage.value}; S.children.push(k); who=k.name }
  } else who = f.lname.value.trim();
  const id=uid();
  S.bookings.push({id,cid:c.id,key:BK.key,start,who,paid:c.price,link:`https://class.seastackschool.com/join/${id}`,parent:S.role==="parent"});
  save(); BK.step="done"; BK.bid=id; toast("Booked and paid"); showBooking();
}

/* ---------- my lessons + family ---------- */
function learning(){
  const now=Date.now(), mine=S.bookings.slice().sort((a,b)=>a.start-b.start);
  const up=mine.filter(b=>b.start+90*6e4>now), past=mine.filter(b=>b.start+90*6e4<=now);
  const row=b=>{const c=cls(b.cid),t=teacher(c.t),open=now>=b.start-10*6e4;return `<div class="lesson">
    <div><b>${esc(c.title)}</b><div class="small muted">${fmtDay(new Date(b.start))}, ${fmtTime(new Date(b.start))} · with ${esc(t.name)} · for ${esc(b.who)}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost sm" href="#/teacher/${t.id}">Review teacher</a>
    <button class="btn sm" onclick="joinLesson('${b.id}')" ${open?"":"title='Opens 10 minutes before the start'"}>${open?"Join lesson":"Join (opens soon)"}</button>
    <button class="btn ghost sm" onclick="cancelB('${b.id}')">${CANCEL===b.id?"Confirm cancel":"Cancel"}</button></div></div>`};
  return `<div class="wrap page">
    <h2>My lessons</h2>
    ${up.length? up.map(row).join("") : `<div class="empty"><h3>No lessons booked yet</h3><p class="muted">Find a class that fits your week.</p><a class="btn" href="#/classes">Find classes</a></div>`}
    ${past.length?`<h3 style="margin-top:24px">Past lessons</h3>${past.map(row).join("")}`:""}
    <div class="box" style="margin-top:28px">
      <h3>Family</h3>
      <p class="muted small">Parent accounts manage bookings for learners under 13. Children don't need their own email or payment details.</p>
      ${S.role!=="parent"?`<p><button class="btn sm ghost" onclick="setRole('parent')">Switch to parent account</button></p>`:""}
      <div class="list" style="margin:10px 0">${S.children.map(k=>`<div class="lesson" style="margin:0"><span><b>${esc(k.name)}</b>, age ${k.age}</span><button class="btn ghost sm" onclick="S.children=S.children.filter(x=>x.id!=='${k.id}');save();render()">Remove</button></div>`).join("")}</div>
      <form class="row" onsubmit="event.preventDefault();S.children.push({id:uid(),name:this.n.value.trim(),age:+this.a.value});save();render();toast('Child added')">
        <label class="field">Child's first name<input name="n" required></label>
        <label class="field">Age<input name="a" type="number" min="3" max="17" required></label>
        <button class="btn sm" style="align-self:end">Add child</button>
      </form>
    </div>
  </div>`;
}
function joinLesson(id){
  const b=S.bookings.find(x=>x.id===id), c=cls(b.cid), open=Date.now()>=b.start-10*6e4;
  $("#dlgBody").innerHTML=`<div class="dlg-head"><h3>${esc(c.title)}</h3><button class="x" onclick="$('#dlg').close()" aria-label="Close">×</button></div>
    ${open?`<div class="ok">The classroom is open. In the full product this launches the video lesson.</div>`:`<div class="notice">The classroom opens 10 minutes before ${fmtTime(new Date(b.start))} on ${fmtDay(new Date(b.start))}. Keep this link handy:</div>`}
    <div class="linkbox" style="margin-top:12px">${esc(b.link)}</div>`;
  $("#dlg").showModal();
}
let CANCEL=null;
function cancelB(id){
  if(CANCEL!==id){ CANCEL=id; render(); toast("Press Confirm cancel to cancel this lesson"); return }
  CANCEL=null; S.bookings=S.bookings.filter(b=>b.id!==id); save(); toast("Lesson cancelled"); render();
}

/* ---------- teacher studio ---------- */
let TAB="plan";
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday"];
function studio(){
  const tabs=[["list","Create a class"],["plan","Weekly planner"],["grades","Students & grades"],["res","Resources"]];
  return `<div class="wrap page">
    <h2>Teacher studio</h2>
    ${S.role!=="teacher"?`<div class="notice">You're viewing as a ${S.role}. <button class="btn sm ghost" onclick="setRole('teacher')">Switch to teacher</button></div>`:""}
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${TAB===k}" onclick="TAB='${k}';render()">${l}</button>`).join("")}</div>
    ${TAB==="plan"?planner():TAB==="grades"?gradebook():TAB==="res"?resources():listings()}
  </div>`;
}
function planner(){
  return `<div class="week">${DAYS.map((d,i)=>`<div class="day"><h4>${d}</h4>
    ${S.plans.filter(p=>p.day===i).map(p=>`<div class="plan"><button onclick="S.plans=S.plans.filter(x=>x.id!=='${p.id}');save();render()" aria-label="Delete ${esc(p.title)}">Delete</button><b>${esc(p.title)}</b>${esc(p.note)}</div>`).join("") || `<span class="small muted">Nothing planned</span>`}
  </div>`).join("")}</div>
  <form class="box row" style="margin-top:16px" onsubmit="event.preventDefault();S.plans.push({id:uid(),day:+this.d.value,title:this.t.value.trim(),note:this.n.value.trim()});save();render();toast('Lesson added to planner')">
    <label class="field">Day<select name="d">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select></label>
    <label class="field">Lesson title<input name="t" required></label>
    <label class="field">Plan notes<input name="n" placeholder="Activities, materials, homework"></label>
    <button class="btn sm" style="align-self:end">Add lesson</button>
  </form>`;
}
function gradebook(){
  const avg=g=>{const v=[g.a1,g.a2,g.a3].filter(x=>x!==""&&x!=null).map(Number);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):"–"};
  return `<div class="scroll"><table><thead><tr><th>Student</th><th>Class</th><th>Quiz 1</th><th>Quiz 2</th><th>Project</th><th>Average</th><th></th></tr></thead><tbody>
    ${S.grades.map(g=>`<tr><td>${esc(g.name)}</td><td class="small">${esc(g.cls)}</td>
      ${["a1","a2","a3"].map(k=>`<td><input type="number" min="0" max="100" value="${esc(g[k])}" aria-label="${k} for ${esc(g.name)}" onchange="setGrade('${g.id}','${k}',this.value)"></td>`).join("")}
      <td><b>${avg(g)}</b></td><td><button class="btn ghost sm" onclick="S.grades=S.grades.filter(x=>x.id!=='${g.id}');save();render()">Remove</button></td></tr>`).join("")}
  </tbody></table></div>
  <form class="box row" style="margin-top:16px" onsubmit="event.preventDefault();S.grades.push({id:uid(),name:this.n.value.trim(),cls:this.c.value,a1:'',a2:'',a3:''});save();render();toast('Student added')">
    <label class="field">Student name<input name="n" required></label>
    <label class="field">Class<select name="c">${allClasses().filter(c=>c.t==="t1"||(A.user&&c.t===A.user.id)).map(c=>`<option>${esc(c.title)}</option>`).join("")}</select></label>
    <button class="btn sm" style="align-self:end">Add student</button>
  </form>`;
}
function setGrade(id,k,v){ const g=S.grades.find(x=>x.id===id); g[k]=v===""?"":Math.max(0,Math.min(100,+v)); save(); render() }
let RQ="";
function resources(){
  const list=S.resources.filter(r=>(r.title+r.subject+r.kind+r.by).toLowerCase().includes(RQ.toLowerCase()));
  return `<label class="field" style="max-width:420px;margin-bottom:14px">Search the shared library<input value="${esc(RQ)}" oninput="RQ=this.value;$('#reslist').innerHTML=resCards()" placeholder="Worksheet, maths, rubric…"></label>
  <div class="grid2" id="reslist">${resCards(list)}</div>
  <form class="box row" style="margin-top:16px" onsubmit="event.preventDefault();S.resources.unshift({id:uid(),title:this.t.value.trim(),subject:this.s.value.trim(),age:this.a.value.trim(),kind:this.k.value,by:'You',url:this.u.value.trim()});save();render();toast('Resource shared')">
    <label class="field">Title<input name="t" required></label>
    <label class="field">Subject<input name="s" required></label>
    <label class="field">Ages<input name="a" placeholder="8–12"></label>
    <label class="field">Type<select name="k"><option>Worksheet</option><option>Lesson plan</option><option>Activity</option><option>Rubric</option><option>Project</option></select></label>
    <label class="field">Link (optional)<input name="u" type="url" placeholder="https://"></label>
    <button class="btn sm" style="align-self:end">Share resource</button>
  </form>`;
}
function resCards(list){
  list = list || S.resources.filter(r=>(r.title+r.subject+r.kind+r.by).toLowerCase().includes(RQ.toLowerCase()));
  return list.length? list.map(r=>`<div class="res"><span class="tag private" style="align-self:start">${esc(r.kind)}</span><b>${esc(r.title)}</b><span class="small muted">${esc(r.subject)}${r.age?", ages "+esc(r.age):""} · shared by ${esc(r.by)}</span>${r.url?`<a class="small" href="${esc(r.url)}" target="_blank" rel="noopener">Open resource</a>`:""}</div>`).join("")
   : `<div class="empty">No resources match. Share the first one below.</div>`;
}
function listings(){
  return `<p class="muted">Create a class. Choose the kind of class first, then set the details students search by. Students can find it once your account is approved.</p>
  ${myClassList()}
  <form class="box row" id="newclass" onsubmit="event.preventDefault();addListing(this)">
    <fieldset class="field" style="grid-column:1/-1;border:0;padding:0;margin:0"><legend>What kind of class is this?</legend><div class="choices">
      <label class="choice"><input type="radio" name="type" value="private" id="nc-private" checked onchange="$('#nc-capwrap').hidden=true"><span><b>Private lesson</b>One student at a time, one-to-one with you.</span></label>
      <label class="choice"><input type="radio" name="type" value="group" id="nc-group" onchange="$('#nc-capwrap').hidden=false"><span><b>Small group class</b>Several students together, up to a size you set.</span></label>
    </div></fieldset>
    <label class="field" style="grid-column:1/-1">Class title<input name="title" id="nc-title" required placeholder="e.g. Conversational French for beginners"></label>
    <label class="field">Subject<input name="subject" id="nc-subject" required></label>
    <label class="field">Teaching language<input name="lang" id="nc-lang" value="English" required></label>
    <label class="field">Student level<select name="level" id="nc-level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label>
    <label class="field">Price per lesson (USD)<input name="price" id="nc-price" type="number" min="1" value="20" required></label>
    <label class="field" id="nc-capwrap" hidden>Maximum class size<input name="cap" id="nc-cap" type="number" min="2" max="12" value="6"></label>
    <label class="field">Youngest age<input name="a0" id="nc-a0" type="number" min="3" value="8"></label>
    <label class="field">Oldest age<input name="a1" id="nc-a1" type="number" min="3" value="12"></label>
    <fieldset class="field" style="grid-column:1/-1;border:0;padding:0;margin:0"><legend>Schedule: which days?</legend><div class="chips">
      ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d,i)=>`<label class="chip"><input type="checkbox" name="day" value="${i}" ${i===2||i===4?"checked":""}> ${d}</label>`).join("")}</div></fieldset>
    <label class="field">Start time (your time)<input name="time" id="nc-time" type="time" value="17:00" required></label>
    <label class="field">Lesson length (minutes)<input name="mins" id="nc-mins" type="number" min="15" step="5" value="45"></label>
    <p class="small muted" style="grid-column:1/-1;margin:0">You set times in your own time zone (${esc(TZ)}). Students see them converted to theirs.</p>
    <button class="btn" style="grid-column:1/-1;justify-self:start">Publish class</button>
  </form>`;
}
function addListing(f){
  const days=[...f.querySelectorAll('[name=day]:checked')].map(x=>+x.value);
  if(!days.length) return toast("Choose at least one day");
  ensureMe();
  const type=f.type.value;
  S.myClasses.push({id:"m"+uid(),t:"me",mine:true,title:f.title.value.trim(),subject:f.subject.value.trim(),lang:f.lang.value.trim(),type,price:+f.price.value,cap:type==="private"?1:Math.max(2,+f.cap.value||6),ages:[+f.a0.value,+f.a1.value||99],level:f.level.value,days,hour:+f.time.value.split(":")[0],mins:+f.mins.value});
  save(); toast("Class published"); render();
}

/* ---------- help ---------- */
function help(){
  const faq=[
    ["How do time zones work?","Every time on SeastackSchool is shown in your device's time zone. Teachers set hours in theirs, and we convert automatically."],
    ["Are the teachers and classes real?","Teachers, classes and reviews marked Demo are samples that show how the platform works. Listings without a Demo tag belong to real teachers whose accounts have been approved. Booking and payment are not open yet."],
    ["What's the difference between a private lesson and a small group class?","A private lesson is one student, one-to-one with the teacher. A small group class has a maximum size the teacher sets, shown on each listing with the places left."],
    ["Who can book?","Students aged 13 and over book for themselves. Parents book for their children from a parent account and choose which child each lesson is for."],
    ["Can my child have their own account?","Learners under 13 are managed from a parent account. Parents book, pay and see every lesson link."],
    ["What if I need to cancel?","Cancel from My lessons. Cancellations made at least 24 hours before the lesson are refunded in full."],
    ["How do teacher accounts work?","Teachers create an account with their email, confirm it, and fill in a profile. Each account is reviewed before the teacher's profile and classes become public."]
  ];
  return `<div class="wrap page"><h2>Help and support</h2>
    <div class="cols"><div>${faq.map(([q,a])=>`<details><summary>${q}</summary><p style="margin:8px 0 0">${a}</p></details>`).join("")}</div>
    <form class="box" onsubmit="event.preventDefault();this.reset();toast('Message sent. We reply within 24 hours.')">
      <h3>Contact support</h3>
      <label class="field">Email<input type="email" required autocomplete="email"></label>
      <label class="field" style="margin-top:8px">Topic<select><option>Booking or payment</option><option>Joining a lesson</option><option>Parent account</option><option>Teaching on SeastackSchool</option><option>Something else</option></select></label>
      <label class="field" style="margin-top:8px">Message<textarea rows="4" required></textarea></label>
      <button class="btn" style="margin-top:12px">Send message</button>
    </form></div></div>`;
}

/* ---------- router ---------- */
function setRole(r){ S.role=r; $("#role").value=r; save(); toast("Viewing as "+r); if(!$("#dlg").open) render() }
function render(){
  const h=location.hash.replace(/^#\/?/,""), [r,arg]=h.split("/");
  const app=$("#app");
  app.innerHTML = r==="classes"?browse(): r==="teacher"?profile(arg): r==="learning"?learning(): r==="studio"?studio(): r==="help"?help(): home();
  document.querySelectorAll("nav.main a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
  if(r==="classes") renderResults();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
$("#role").value=S.role; $("#role").onchange=e=>setRole(e.target.value);
$("#tzname").textContent=TZ;
$("#dlg").addEventListener("close",()=>{ if(BK.step==="done") render() });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="accounts.js?v=2"></script>

</body>
